name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # required for softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: windows-latest   # critical — pywin32/Word COM is Windows-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.12+ required: Merge.py uses PEP 701 f-strings (backslash in expression), a SyntaxError on 3.11
      - run: pip install pyinstaller flask flask-cors pandas openpyxl pymupdf python-docx pywin32
      - run: pyinstaller --onefile --name Gospelink --add-data "static;static" --paths . --hidden-import win32com --hidden-import win32com.client --collect-all pywin32 --collect-all fitz --icon=icon.ico server.py
      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: Gospelink
          path: dist/Gospelink.exe
          retention-days: 30
      - name: Upload to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Gospelink.exe
