name: Build and Release

on:
  push:
    tags:
      - 'v*'   # triggers on git tags like v1.2.3

jobs:
  build:
    runs-on: windows-latest   # critical — pywin32/Word COM is Windows-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller flask flask-cors pandas openpyxl pymupdf python-docx pywin32
      - run: |
          pyinstaller --onefile --name Gospelink \
            --add-data "static;static" \
            --hidden-import win32com \
            --hidden-import win32com.client \
            --collect-all pywin32 \
            --icon=icon.ico server.py
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Gospelink.exe
